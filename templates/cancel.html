{% extends "base.html" %}

{% block title %}Bochi | 途中終了{% endblock %}

{% block content %}
    <h1>今回はここまでにしました</h1>
    <p>今日やったタスク↓</p>
    <ul>
        {% for task in tasks %}
            <li>{% if task.done %}✅{% else %}(未完了){% endif %} {{ task.name }}</li>
        {% endfor %}
    </ul>
    <p>進捗: {{ rate | round(1) }}%</p>

    <form action="/save" method="POST">
        <label for="memo">今日の振り返り（一言メモ）</label><br>
        <textarea id="memo" name="memo" rows="3" placeholder="例: 寝不足だった"></textarea><br>
        <button class="primary" type="submit">記録する</button>
    </form>
{% endblock %}
