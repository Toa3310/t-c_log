{% extends "base.html" %}

{% block title %}Bochi | 開始画面{% endblock %}

{% block content %}
    <h1>今日の調子を選んでください</h1>
    <form action="/tasks" method="POST">
        <button type="submit" name="condition" value="0">よくない</button>
        <button type="submit" name="condition" value="1">普通</button>
        <button type="submit" name="condition" value="2">良い</button>
    </form>

    {% if message %}
        <p style="color: red;">{{ message }}</p>
    {% endif %}
    {% if tasks %}
        <h2>タスクの選択(1つ以上選択してください)</h2>
        <form action="/start" method="POST">
            <input type="hidden" name="condition" value="{{ condition }}">
            {% for task in tasks %}
                <input type="checkbox" name="selected_tasks" value="{{task.name}}">
                <label>{{task.name}}</label><br>
            {% endfor %}
            <button class="primary" type="submit">このタスクで始める</button>
        </form>
    {% endif %}
{% endblock %}
