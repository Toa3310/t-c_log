{% extends "base.html" %}

{% block title %}Bochi | タスク完了{% endblock %}

{% block content %}
    <div class="celebrate">
        <div class="emoji">🎉</div>
        <h1>今日のタスク、全部完了！</h1>
        <p class="big-rate">{{ rate | round | int }}%</p>
        <p class="sub">よくがんばりました！</p>
    </div>

    <h2>完了したタスク</h2>
    <ul class="done-list">
        {% for task in tasks %}
            <li>✅ {{ task.name }}</li>
        {% endfor %}
    </ul>

    <form action="/save" method="POST">
        <label for="memo">今日の振り返り（一言メモ）</label><br>
        <textarea id="memo" name="memo" rows="3" placeholder="例: 順調だった"></textarea><br>
        <button class="primary" type="submit">記録する</button>
    </form>
{% endblock %}
