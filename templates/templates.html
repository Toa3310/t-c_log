{% extends "base.html" %}

{% block title %}タスクテンプレート一覧{% endblock %}

{% block content %}
    <h1>タスクのテンプレート一覧</h1>
    <p><a href="/">トップに戻る</a></p>
    <table>
        <tr>
            <th>コンディション</th>
            <th>タスク名</th>
        </tr>
        {% for g in groups %}
        <tr>
            <td>{{ g.condition }}</td>
            <td>
                {% for name in g.names %}
                    {{ name }}{% if not loop.last %}, {% endif %}
                {% endfor %}
            </td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
